name: CI/CD Spring Boot WAR on Windows

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR
        run: mvn clean package

      - name: Deploy to Tomcat 10.1
        shell: powershell
        run: |
          $TomcatPath = "C:\Program Files\Apache Software Foundation\Tomcat 10.1"

          & "$TomcatPath\bin\shutdown.bat"
          Start-Sleep -Seconds 5

          Remove-Item "$TomcatPath\webapps\HOOT*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "target\HOOT.war" "$TomcatPath\webapps\HOOT.war"

          & "$TomcatPath\bin\startup.bat"
