name: CI/CD Spring Boot WAR on Windows

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build WAR with Maven
      run: mvn clean package

    - name: Deploy to Windows Tomcat
      shell: powershell
      run: |
        $TomcatPath = "C:\Program Files\Apache Software Foundation\Tomcat 10.1"  # Tomcat installation path
        Remove-Item -Recurse -Force "$TomcatPath\webapps\HOOT"
        Remove-Item -Force "$TomcatPath\webapps\HOOT.war"
        Copy-Item -Path "target\HOOT.war" -Destination "$TomcatPath\webapps\HOOT.war"
        & "$TomcatPath\bin\shutdown.bat"
        Start-Sleep -Seconds 5
        & "$TomcatPath\bin\startup.bat"
